<!doctype html>
<html lang="en" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- seo:start -->
    <title>Monoroh — Mobile App Developer</title>
    <meta data-rh="true" name="description" content="Mobile developer. I build apps for iOS, Android, desktop and web, often with Kotlin Multiplatform." />
    <!-- seo:end -->
    <meta name="author" content="Monoroh" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="telegram:channel" content="@monoroh" />

    <link rel="icon" type="image/png" sizes="32x32" href="/media/develop_favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/media/develop_logo_512x512.png" />

    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Prevent FOUC: apply persisted theme and locale before paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('monoroh:theme');
          var theme = stored === 'light' || stored === 'dark' ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try {
          var storedLang = localStorage.getItem('monoroh:locale');
          var locale = storedLang === 'en' || storedLang === 'ru' ? storedLang
            : ((navigator.language || 'en').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en');
          document.documentElement.setAttribute('lang', locale);
        } catch (e) {
          document.documentElement.setAttribute('lang', 'en');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
